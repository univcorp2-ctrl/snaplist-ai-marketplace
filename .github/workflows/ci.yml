name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Python package
        run: pip install -e '.[dev]'
      - name: Python lint (critical rules)
        run: ruff check app tests --select E9,F63,F7,F82
      - name: Python compile
        run: python -m compileall -q app
      - name: Python tests
        run: pytest -q
      - name: Web logic tests
        run: npm test
      - name: Validate PWA files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('web/manifest.webmanifest').read_text())
          assert manifest['display'] == 'standalone'
          html = Path('web/index.html').read_text()
          app = Path('web/app.js').read_text()
          core = Path('web/core.js').read_text()
          assert '<title>SnapList AI</title>' in html
          assert 'capture="environment"' in html
          assert 'serviceWorker' in app
          assert 'yahoo-fleamarket' in core
          assert 'ufeff' in core
          print('web validation ok')
          PY
      - name: Upload PWA artifact
        uses: actions/upload-artifact@v4
        with:
          name: snaplist-pwa
          path: web/
          if-no-files-found: error
